[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arkmind"
version = "0.1.0"
description = "ArkMind — Personal Knowledge OS"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
]

[project.scripts]
arkmind-run = "arkmind.runner.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "black",
    "mypy",
    "types-pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arkmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
packages = ["arkmind"]
mypy_path = "src"
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pymupdf", "pdfplumber", "fitz"]
ignore_missing_imports = true
